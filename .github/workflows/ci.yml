name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Host behavior tests with sanitizers
        run: ./scripts/test-firmware.sh
      - uses: arduino/setup-arduino-cli@v2.0.0
        with:
          version: 1.6.0
      - run: arduino-cli core update-index
      - run: arduino-cli core install arduino:avr@1.8.8
      - run: arduino-cli compile --fqbn arduino:avr:uno --warnings all firmware/robot
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.4
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --fatal-infos
      - run: flutter test --coverage
        timeout-minutes: 5
      - run: flutter build apk --debug
      - name: Create disposable CI signing identity
        run: |
          TEST_KEY_PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::$TEST_KEY_PASSWORD"
          export TEST_KEY_PASSWORD
          keytool -genkeypair -noprompt -storetype PKCS12 \
            -keystore android/ci-test-signing.p12 -alias ci-test \
            -storepass:env TEST_KEY_PASSWORD -keypass:env TEST_KEY_PASSWORD \
            -keyalg RSA -keysize 3072 -validity 30 \
            -dname "CN=Disposable CI test key"
          printf 'storeFile=ci-test-signing.p12\nstorePassword=%s\nkeyAlias=ci-test\nkeyPassword=%s\n' \
            "$TEST_KEY_PASSWORD" "$TEST_KEY_PASSWORD" > android/key.properties
      - run: flutter build apk --release
      - name: Verify release APK is signed and non-debuggable
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          test "$("$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest debuggable "$APK")" = false
